name: Frontend static smoke check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract and parse browser module
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          matches = re.findall(r'<script type="module">\s*(.*?)\s*</script>', html, re.S)
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one inline module script; found {len(matches)}")
          Path("/tmp/artcb-frontend-inline.mjs").write_text(matches[0], encoding="utf-8")

          required = [
              "SIMULATED DEMO DATA",
              "navigator.mediaDevices",
              "HandLandmarker.createFromOptions",
              "raycaster.intersectObjects",
              "delegate:'CPU'",
              "video.srcObject=null",
          ]
          missing = [marker for marker in required if marker not in html]
          if missing:
              raise SystemExit("Missing expected frontend behavior markers: " + ", ".join(missing))
          print("Static frontend behavior markers: PASS")
          PY
          node --check /tmp/artcb-frontend-inline.mjs
